services:
  ragflow:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ragflow.rule=Host(`ragflow.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.ragflow.loadbalancer.server.port=${HARBOR_RAGFLOW_HOST_PORT}"
      - "traefik.http.routers.ragflow.entrypoints=websecure"
      - "traefik.http.routers.ragflow.tls=true"
      - "traefik.http.routers.ragflow.service=ragflow"

    networks:
      - traefik-public
