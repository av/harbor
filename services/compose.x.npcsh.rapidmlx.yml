services:
  npcsh:
    depends_on:
      rapidmlx:
        condition: service_healthy
    environment:
      - NPCSH_CHAT_MODEL=${HARBOR_RAPIDMLX_MODEL}
      - NPCSH_CHAT_PROVIDER=openai-like
      - NPCSH_VISION_MODEL=${HARBOR_RAPIDMLX_MODEL}
      - NPCSH_VISION_PROVIDER=openai-like
      - NPCSH_REASONING_MODEL=${HARBOR_RAPIDMLX_MODEL}
      - NPCSH_REASONING_PROVIDER=openai-like
      - NPCSH_API_URL=http://rapidmlx:8080/v1
      - OPENAI_BASE_URL=http://rapidmlx:8080/v1
      - OPENAI_API_BASE=http://rapidmlx:8080/v1
      - OPENAI_API_KEY=${HARBOR_RAPIDMLX_API_KEY}
