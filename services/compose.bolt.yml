services:
  bolt:
    container_name: ${HARBOR_CONTAINER_PREFIX}.bolt
    image: ${HARBOR_BOLT_IMAGE}:${HARBOR_BOLT_VERSION}
    ports:
      - ${HARBOR_BOLT_HOST_PORT}:5173
    env_file:
      - ./.env
      - ./services/bolt/override.env
    # bolt.diy reads .env.local at runtime (bindings.sh) — the image ships
    # a prebuilt app, so no in-container rebuild is needed (and none is
    # possible: the production image has no dev dependencies).
    volumes:
      - ./services/bolt/.env.local:/app/.env.local
    # The upstream production image prunes dev dependencies but its own
    # dockerstart script still expects the wrangler CLI — fetch a matching
    # wrangler via npx at startup (upstream pins ^4).
    command: >
      bash -c 'bindings=$(./bindings.sh) &&
      npx -y wrangler@4 pages dev ./build/client $bindings
      --ip 0.0.0.0 --port 5173 --no-show-interactive-dev-session'
    networks:
      - harbor-network