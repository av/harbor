services:
  jupyter:
    container_name: ${HARBOR_CONTAINER_PREFIX}.jupyter
    env_file:
      - ./.env
      - ./services/jupyter/override.env
    build:
      context: ./services/jupyter
      dockerfile: Dockerfile
      args:
        HARBOR_JUPYTER_IMAGE: ${HARBOR_JUPYTER_IMAGE}
        HARBOR_JUPYTER_EXTRA_DEPS: ${HARBOR_JUPYTER_EXTRA_DEPS}
    ports:
      - ${HARBOR_JUPYTER_HOST_PORT}:8888
    command: [
      "jupyter", "lab",
      "--port=8888", "--ip=0.0.0.0",
      "--allow-root", "--browser=false", "--no-browser",
      "--IdentityProvider.token=''",
      "--ServerApp.password=''",
      "--allow_remote_access=true",
      "--NotebookApp.disable_check_xsrf=True",
    ]
    volumes:
      - ${HARBOR_JUPYTER_WORKSPACE}:/app/workspace
      - ${HARBOR_HF_CACHE:-./services/jupyter/.hf-cache}:/root/.cache/huggingface
      - ${HARBOR_VLLM_CACHE}:/root/.cache/vllm
      # GGUFs in the llama.cpp cache can be symlinks to absolute host HF-cache
      # blob paths; bind the HF cache at the same host-absolute path so they resolve
      - ${HARBOR_HF_CACHE:-./services/jupyter/.hf-cache}:${HOME}/.cache/huggingface:ro
      - ${HARBOR_LLAMACPP_CACHE}:/root/.cache/llama.cpp
      - ${HARBOR_OLLAMA_CACHE}:/root/.ollama
    networks:
      - harbor-network
    environment:
      - HF_TOKEN=${HARBOR_HF_TOKEN}