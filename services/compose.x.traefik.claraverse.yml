services:
  claraverse:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claraverse.rule=Host(`claraverse.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.claraverse.loadbalancer.server.port=${HARBOR_CLARAVERSE_HOST_PORT}"
      - "traefik.http.routers.claraverse.entrypoints=websecure"
      - "traefik.http.routers.claraverse.tls=true"
      - "traefik.http.routers.claraverse.service=claraverse"

    networks:
      - traefik-public
