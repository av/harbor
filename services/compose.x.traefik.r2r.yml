# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  r2r:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.r2r.rule=Host(`r2r.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.r2r.loadbalancer.server.port=${HARBOR_R2R_DASHBOARD_PORT}"
      - "traefik.http.routers.r2r.entrypoints=websecure"
      - "traefik.http.routers.r2r.tls=true"
      - "traefik.http.routers.r2r.service=r2r"

    networks:
      - traefik-public
