services:
  presenton:
    depends_on:
      - prismml
    environment:
      # Presenton's "custom" provider is any OpenAI-compatible endpoint.
      - LLM=custom
      - CUSTOM_LLM_URL=http://prismml:8080/v1
      - CUSTOM_LLM_API_KEY=sk-prismml
      # Must be a model id prismml actually serves (see /v1/models);
      # Ollama-style tags match nothing here.
      - CUSTOM_MODEL=${HARBOR_PRESENTON_PRISMML_MODEL}
