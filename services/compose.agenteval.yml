services:
  agenteval:
    container_name: ${HARBOR_CONTAINER_PREFIX}.agenteval
    build:
      context: ./services/agenteval
      dockerfile: Dockerfile
      args:
        AGENTEVAL_VERSION: ${HARBOR_AGENTEVAL_VERSION}
    env_file:
      - ./.env
      - ./services/agenteval/override.env
    user: "${HARBOR_USER_ID}:${HARBOR_GROUP_ID}"
    group_add:
      - "${HARBOR_AGENTEVAL_DOCKER_GID}"
    environment:
      HOME: ${HARBOR_AGENTEVAL_WORKSPACE}
      HARBOR_TELEMETRY: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The host daemon must see the same absolute paths as the runner.
      - ${HARBOR_AGENTEVAL_WORKSPACE}:${HARBOR_AGENTEVAL_WORKSPACE}:z
    working_dir: ${HARBOR_AGENTEVAL_WORKSPACE}
    command: ["sleep", "infinity"]
    security_opt:
      - label=disable
    networks:
      - harbor-network
