# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  rapidmlx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rapidmlx.rule=Host(`rapidmlx.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.rapidmlx.loadbalancer.server.port=8080"
      - "traefik.http.routers.rapidmlx.entrypoints=websecure"
      - "traefik.http.routers.rapidmlx.tls=true"
      - "traefik.http.routers.rapidmlx.service=rapidmlx"

    networks:
      - traefik-public
