services:
  prismml:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prismml.rule=Host(`prismml.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.prismml.loadbalancer.server.port=8080"
