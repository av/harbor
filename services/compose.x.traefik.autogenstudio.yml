services:
  autogenstudio:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autogenstudio.rule=Host(`autogenstudio.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.autogenstudio.loadbalancer.server.port=${HARBOR_AUTOGENSTUDIO_HOST_PORT}"
