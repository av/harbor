services:
  kotaemon:
    environment:
      # Registers kotaemon's "openai" LLM/embeddings pair against prismml.
      # A real (non-placeholder) OPENAI_API_KEY makes it the default LLM.
      - OPENAI_API_BASE=http://prismml:8080/v1
      - OPENAI_API_KEY=sk-prismml
      # Must be a model id prismml actually serves (see /v1/models);
      # Ollama-style tags match nothing here. LOCAL_MODEL is intentionally
      # not set: it registers Ollama-URL entries that are dead without
      # Ollama running.
      - OPENAI_CHAT_MODEL=${HARBOR_KOTAEMON_PRISMML_MODEL}
