services:
  comfyui:
    env_file:
      - ./.env
      - ./services/comfyui/override.env
    container_name: ${HARBOR_CONTAINER_PREFIX}.comfyui
    image: ${HARBOR_COMFYUI_IMAGE}:${HARBOR_COMFYUI_VERSION}
    environment:
      # comfyui-boot appends CLI_ARGS after its own "--listen --port 8188";
      # argparse last-wins, so passing --port here makes ComfyUI listen on
      # the host port internally too — keeps webui/traefik integrations
      # (which target http://comfyui:${HARBOR_COMFYUI_HOST_PORT}) working.
      - CLI_ARGS=--port ${HARBOR_COMFYUI_HOST_PORT} ${HARBOR_COMFYUI_ARGS}
      - HF_TOKEN=${HARBOR_HF_TOKEN}
      - CIVITAI_TOKEN=${HARBOR_CIVITAI_TOKEN}
      # Toggles Harbor's pre-start model provisioning (Flux.1-schnell set
      # used by the Open WebUI image-generation integration)
      - HARBOR_COMFYUI_PROVISIONING=${HARBOR_COMFYUI_PROVISIONING}
      - HARBOR_COMFYUI_HOST_PORT=${HARBOR_COMFYUI_HOST_PORT}
    ports:
      - ${HARBOR_COMFYUI_HOST_PORT}:${HARBOR_COMFYUI_HOST_PORT}
    volumes:
      # comfyui-boot persists everything (ComfyUI checkout, models,
      # custom nodes, outputs) under /root
      - ${HARBOR_COMFYUI_WORKSPACE}:/root
      # comfyui-boot runs /root/user-scripts/pre-start.sh on every start;
      # Harbor mounts its provisioning script there (rw — the entrypoint
      # chmods it before sourcing)
      - ./services/comfyui/provisioning.sh:/root/user-scripts/pre-start.sh
      - ./services/comfyui/default-workflow.json:/opt/harbor/default-workflow.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:'+os.environ['HARBOR_COMFYUI_HOST_PORT']+'/system_stats')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Wait for the init sidecar to chown the workspace bind mount so the
    # host directory stays owned by the host user — recoverable without
    # `sudo`. Docker creates missing bind-mount targets as root:root by
    # default; this fixup runs before the main container starts.
    depends_on:
      comfyui-init:
        condition: service_completed_successfully
    networks:
      - harbor-network

  # Init sidecar: chowns the workspace bind mount to HARBOR_USER_ID:HARBOR_GROUP_ID
  # before the main container starts. Mirrors the pattern used for unsloth-studio
  # and beszel.
  comfyui-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.comfyui-init
    image: alpine:3.20
    env_file:
      - ./.env
      - ./services/comfyui/override.env
    environment:
      TARGET_UID: ${HARBOR_USER_ID}
      TARGET_GID: ${HARBOR_GROUP_ID}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./services/comfyui/workspace-init.sh:/init.sh:ro
      - ${HARBOR_COMFYUI_WORKSPACE}:/workspace
    networks:
      - harbor-network
