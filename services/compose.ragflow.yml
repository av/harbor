services:
  ragflow:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow
    image: ${HARBOR_RAGFLOW_IMAGE}:${HARBOR_RAGFLOW_VERSION}
    env_file:
      - ./.env
      - ./services/ragflow/override.env
    command: ["--enable-adminserver", "--init-model-provider-tables"]
    ports:
      - ${HARBOR_RAGFLOW_BIND_HOST}:${HARBOR_RAGFLOW_HOST_PORT}:80
    environment:
      DOC_ENGINE: elasticsearch
      DB_TYPE: mysql
      API_PROXY_SCHEME: python
      MYSQL_HOST: mysql
      MYSQL_DBNAME: rag_flow
      MYSQL_USER: root
      MYSQL_PASSWORD: ${HARBOR_RAGFLOW_MYSQL_PASSWORD}
      ES_HOST: es01
      ELASTIC_PASSWORD: ${HARBOR_RAGFLOW_ES_PASSWORD}
      MINIO_HOST: minio
      MINIO_USER: rag_flow
      MINIO_PASSWORD: ${HARBOR_RAGFLOW_S3_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${HARBOR_RAGFLOW_REDIS_PASSWORD}
      ADMIN_DEFAULT_PASSWORD: ${HARBOR_RAGFLOW_ADMIN_PASSWORD}
      SECRET_KEY: ${HARBOR_RAGFLOW_SECRET_KEY}
      REGISTER_ENABLED: ${HARBOR_RAGFLOW_REGISTER_ENABLED}
      ENABLE_REGISTER: ${HARBOR_RAGFLOW_REGISTER_ENABLED}
      TZ: UTC
    volumes:
      - ragflow-logs:/ragflow/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      ragflow-preflight:
        condition: service_completed_successfully
      ragflow-mysql:
        condition: service_healthy
      ragflow-es:
        condition: service_healthy
      ragflow-s3:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
    networks:
      - harbor-network

  ragflow-preflight:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow-preflight
    image: alpine:3.20
    env_file:
      - ./.env
    entrypoint: ["/bin/sh", "/preflight.sh"]
    volumes:
      - ./services/ragflow/preflight.sh:/preflight.sh:ro
    networks:
      - harbor-network

  ragflow-mysql:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow-mysql
    image: ${HARBOR_RAGFLOW_MYSQL_IMAGE}:${HARBOR_RAGFLOW_MYSQL_VERSION}
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${HARBOR_RAGFLOW_MYSQL_PASSWORD}
      MYSQL_DATABASE: rag_flow
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ragflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      ragflow-preflight:
        condition: service_completed_successfully
    networks:
      harbor-network:
        aliases: [mysql]

  ragflow-es:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow-es
    image: ${HARBOR_RAGFLOW_ES_IMAGE}:${HARBOR_RAGFLOW_ES_VERSION}
    env_file:
      - ./.env
    environment:
      node.name: es01
      discovery.type: single-node
      ELASTIC_PASSWORD: ${HARBOR_RAGFLOW_ES_PASSWORD}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      bootstrap.memory_lock: "false"
    mem_limit: ${HARBOR_RAGFLOW_ES_MEMORY}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tmpfs:
      - /tmp:mode=1777,size=512m
    volumes:
      - ragflow-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 90
    depends_on:
      ragflow-preflight:
        condition: service_completed_successfully
    networks:
      harbor-network:
        aliases: [es01]

  ragflow-s3:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow-s3
    image: ${HARBOR_RAGFLOW_S3_IMAGE}:${HARBOR_RAGFLOW_S3_VERSION}
    env_file:
      - ./.env
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: rag_flow
      MINIO_ROOT_PASSWORD: ${HARBOR_RAGFLOW_S3_PASSWORD}
    volumes:
      - ragflow-s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      ragflow-preflight:
        condition: service_completed_successfully
    networks:
      harbor-network:
        aliases: [minio]

  ragflow-redis:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ragflow-redis
    image: ${HARBOR_RAGFLOW_REDIS_IMAGE}:${HARBOR_RAGFLOW_REDIS_VERSION}
    env_file:
      - ./.env
    command: ["redis-server", "--requirepass", "${HARBOR_RAGFLOW_REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - ragflow-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$HARBOR_RAGFLOW_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      ragflow-preflight:
        condition: service_completed_successfully
    networks:
      harbor-network:
        aliases: [redis]

volumes:
  ragflow-logs:
  ragflow-mysql-data:
  ragflow-es-data:
  ragflow-s3-data:
  ragflow-redis-data:
