# DeerFlow Ollama Integration
# Points the Harbor model entry at Harbor's Ollama (OpenAI-compatible endpoint)
services:
  deerflow-backend:
    environment:
      - DEERFLOW_MODEL=${HARBOR_DEERFLOW_MODEL}
      - DEERFLOW_MODEL_BASE_URL=${HARBOR_OLLAMA_INTERNAL_URL}/v1
      - DEERFLOW_MODEL_API_KEY=ollama
    depends_on:
      - ollama
