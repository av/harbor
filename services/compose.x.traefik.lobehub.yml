services:
  lobehub:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lobehub.rule=Host(`lobehub.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.lobehub.loadbalancer.server.port=${HARBOR_LOBEHUB_HOST_PORT}"
