services:
  dify-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-init
    image: busybox:latest
    env_file:
      - ./.env
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/app/storage:/app/api/storage
    restart: "no"
    networks:
      - harbor-network

  dify-api:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-api
    image: langgenius/dify-api:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    environment:
      MODE: api
    depends_on:
      dify-init:
        condition: service_completed_successfully
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
      dify-agent:
        condition: service_started
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/app/storage:/app/api/storage
    networks:
      - harbor-network

  dify-worker:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-worker
    image: langgenius/dify-api:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    environment:
      MODE: worker
    depends_on:
      dify-init:
        condition: service_completed_successfully
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/app/storage:/app/api/storage
    networks:
      - harbor-network

  dify-worker-beat:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-worker-beat
    image: langgenius/dify-api:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    environment:
      MODE: beat
    depends_on:
      dify-init:
        condition: service_completed_successfully
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
    networks:
      - harbor-network

  dify-web:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-web
    image: langgenius/dify-web:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    networks:
      - harbor-network

  dify-db:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-db
    image: postgres:15-alpine
    env_file:
      - ./.env
      - ./services/dify/override.env
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/db/data:/var/lib/postgresql/data
    ports:
      - ${HARBOR_DIFY_DB_HOST_PORT}:5432
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "dify-db", "-U", "postgres", "-d", "dify" ]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - harbor-network

  dify-redis:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-redis
    image: redis:6-alpine
    env_file:
      - ./.env
      - ./services/dify/override.env
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/redis/data:/data
    command: redis-server --requirepass difyai123456
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a difyai123456 ping | grep -q PONG" ]
      interval: 1s
      timeout: 3s
    networks:
      - harbor-network

  dify-sandbox:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-sandbox
    image: langgenius/dify-sandbox:${HARBOR_DIFY_SANDBOX_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: true
      HTTP_PROXY: http://dify-ssrf:3128
      HTTPS_PROXY: http://dify-ssrf:3128
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/sandbox/dependencies:/dependencies
      - ./services/dify/sandbox/config.yaml:/conf/config.yaml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8194/health" ]
    networks:
      - harbor-network

  dify-plugin-daemon:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-plugin-daemon
    image: langgenius/dify-plugin-daemon:${HARBOR_DIFY_PLUGIN_DAEMON_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    environment:
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      SERVER_PORT: 5002
      SERVER_KEY: lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: true
      PYTHON_ENV_INIT_TIMEOUT: 120
      PLUGIN_MAX_EXECUTION_TIMEOUT: 600
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/plugin_daemon:/app/storage
    depends_on:
      dify-db:
        condition: service_healthy
    networks:
      - harbor-network

  dify-agent:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-agent
    image: langgenius/dify-agent-backend:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
      - ./services/dify/override.env
    depends_on:
      dify-redis:
        condition: service_started
      dify-plugin-daemon:
        condition: service_started
    networks:
      - harbor-network

  dify-local-sandbox:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-local-sandbox
    image: langgenius/dify-agent-local-sandbox:${HARBOR_DIFY_VERSION}
    env_file:
      - ./.env
    environment:
      - SHELLCTL_AUTH_TOKEN=
      - HTTP_PROXY=http://dify-agent-ssrf:3128
      - HTTPS_PROXY=http://dify-agent-ssrf:3128
      - NO_PROXY=localhost,127.0.0.1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5004/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harbor-network

  dify-agent-ssrf:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-agent-ssrf
    image: ubuntu/squid:latest
    env_file:
      - ./.env
    volumes:
      - ./services/dify/ssrf_proxy/squid-agent.conf.template:/etc/squid/squid.conf.template
      - ./services/dify/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./services/dify/ssrf_proxy/docker-agent-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint: [ "sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh" ]
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
    networks:
      - harbor-network

  dify-ssrf:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-ssrf
    image: ubuntu/squid:latest
    env_file:
      - ./.env
      - ./services/dify/override.env
    volumes:
      - ./services/dify/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./services/dify/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./services/dify/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint: [ "sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh" ]
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
    networks:
      - harbor-network

  dify-certbot:
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-certbot
    image: certbot/certbot
    env_file:
      - ./.env
      - ./services/dify/override.env
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/certbot/conf:/etc/letsencrypt
      - ${HARBOR_DIFY_WORKSPACE}/certbot/www:/var/www/html
      - ${HARBOR_DIFY_WORKSPACE}/certbot/logs:/var/log/letsencrypt
      - ${HARBOR_DIFY_WORKSPACE}/certbot/conf/live:/etc/letsencrypt/live
      - ./services/dify/certbot/update-cert.template.txt:/update-cert.template.txt
      - ./services/dify/certbot/docker-entrypoint.sh:/docker-entrypoint.sh
    entrypoint: [ "/docker-entrypoint.sh" ]
    command: ["tail", "-f", "/dev/null"]
    networks:
      - harbor-network

  dify:
    image: nginx:latest
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify
    volumes:
      - ./services/dify/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./services/dify/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template
      - ./services/dify/nginx/https.conf.template:/etc/nginx/https.conf.template
      - ./services/dify/nginx/conf.d:/etc/nginx/conf.d
      - ./services/dify/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh
      - ./services/dify/nginx/ssl:/etc/ssl
      - ${HARBOR_DIFY_WORKSPACE}/certbot/conf/live:/etc/letsencrypt/live
      - ${HARBOR_DIFY_WORKSPACE}/certbot/conf:/etc/letsencrypt
      - ${HARBOR_DIFY_WORKSPACE}/certbot/www:/var/www/html
    entrypoint: [ "sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh" ]
    env_file:
      - ./.env
      - ./services/dify/override.env
    depends_on:
      - dify-api
      - dify-web
    ports:
      - ${HARBOR_DIFY_HOST_PORT}:80
    networks:
      - harbor-network

  dify-weaviate:
    image: semitechnologies/weaviate:${HARBOR_DIFY_WEAVIATE_VERSION}
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-weaviate
    volumes:
      - ${HARBOR_DIFY_WORKSPACE}/weaviate:/var/lib/weaviate
    env_file:
      - ./.env
      - ./services/dify/override.env
    networks:
      - harbor-network

  dify-openai:
    build:
      context: ./services/dify/openai
      dockerfile: Dockerfile
    container_name: ${HARBOR_CONTAINER_PREFIX}.dify-openai
    ports:
      - ${HARBOR_DIFY_D2O_HOST_PORT}:3000
    env_file:
      - ./.env
      - ./services/dify/override.env
    volumes:
      - ./services/dify/openai/app.js:/dify2openai/app.js
    networks:
      - harbor-network
    environment:
      - DIFY_API_URL=http://harbor.dify:80
      - BOT_TYPE=${HARBOR_DIFY_BOT_TYPE}
