services:
  # llmman (https://github.com/llmmanorg/llmman) runs on the host; this Caddy
  # proxy exposes it on the Harbor network, like dmr/mlx/omlx.
  llmman:
    container_name: ${HARBOR_CONTAINER_PREFIX}.llmman
    image: ${HARBOR_LLMMAN_IMAGE}:${HARBOR_LLMMAN_VERSION}
    env_file:
      - ./.env
      - ./services/llmman/override.env
    ports:
      - ${HARBOR_LLMMAN_HOST_PORT}:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/llmman/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - harbor-network
