# Harbor: the airweave backend hard-probes GET /health on the text2vec
# inference service, but semitechnologies/transformers-inference only
# serves /.well-known/ready. Rewrite /health, pass everything else through.
server {
    listen 8080;

    location = /health {
        proxy_pass http://airweave-embeddings:8080/.well-known/ready;
    }

    location / {
        proxy_pass http://airweave-embeddings:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
